version: 2

sources:
  - name: raw
    database: MAVEN_TOYS       
    schema: RAW 
    description: "Raw CSV files from Maven Analytics Mexico Toy Sales dataset"
    tables:
      - name: products
        description: "Raw product catalog with cost and price as strings"
      - name: sales
        description: "Raw sales transactions Jan 2017 to Oct 2018"
      - name: stores
        description: "Raw store master data with open date as string"
      - name: inventory
        # description: "Raw inventory snapshot as of Oct 2018"
      - name: calendar
        description: "Raw date list — enriched in staging"

models:
  - name: stg_maven_toys_products
    description: "Cleaned products. Dollar signs stripped, cost and price cast to DECIMAL. Unit margin derived."
    columns:
      - name: product_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Name of the product"
        tests:
          - not_null
      - name: product_category
        description: "Category the product belongs to"
        tests:
          - not_null
      - name: product_cost_usd
        description: "Cost cleaned from string, cast to DECIMAL"
        tests:
          - not_null
      - name: product_price_usd
        description: "Price cleaned from string, cast to DECIMAL"
        tests:
          - not_null
      - name: unit_margin_usd
        description: "Derived: price minus cost per unit"

  - name: stg_maven_toys_sales
    description: "Cleaned sales transactions. Date cast from string to DATE."
    columns:
      - name: sale_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: sale_date
        description: "Transaction date cast to DATE"
        tests:
          - not_null
      - name: store_id
        description: "Foreign key to stores"
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to products"
        tests:
          - not_null
      - name: units
        description: "Units sold in this transaction"
        tests:
          - not_null

  - name: stg_maven_toys_stores
    description: "Cleaned stores. Open date cast to DATE. Store age derived."
    columns:
      - name: store_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: store_name
        description: "Store name"
        tests:
          - not_null
      - name: store_city
        description: "City where the store is located"
        tests:
          - not_null
      - name: store_location
        description: "Location type: Downtown, Airport, Commercial, Residential"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Downtown', 'Airport', 'Commercial', 'Residential']
      - name: store_open_date
        description: "Store opening date cast to DATE"
        tests:
          - not_null

  - name: stg_maven_toys_inventory
    description: "Cleaned inventory snapshot."
    columns:
      - name: store_id
        description: "Foreign key to stores"
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to products"
        tests:
          - not_null
      - name: stock_on_hand
        description: "Units currently in stock"
        tests:
          - not_null

  - name: stg_maven_toys_calendar
    description: "Enriched date dimension with year, month, quarter, weekday and weekend flag."
    columns:
      - name: date
        description: "Primary key — one row per date"
        tests:
          - unique
          - not_null
      - name: year
        description: "Calendar year"
      - name: month_number
        description: "Month number 1-12"
      - name: month_name
        description: "Full month name"
      - name: quarter_number
        description: "Quarter number 1-4"
      - name: quarter_label
        description: "Q1, Q2, Q3, Q4"
      - name: day_name
        description: "Day name e.g. Monday"
      - name: is_weekend
        description: "TRUE if Saturday or Sunday"